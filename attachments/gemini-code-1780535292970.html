    .page-grid { position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(37, 99, 235, .09) 1px, transparent 1px), linear-gradient(90deg, rgba(37, 99, 235, .09) 1px, transparent 1px); background-size: 5mm 5mm; opacity: 0; } .report-page.show-grid .page-grid { opacity: 1; }
    #guides-container { position: absolute; inset: 0; pointer-events: none; z-index: 99998; } .smart-guide { position: absolute; background: #0ea5e9; box-shadow: 0 0 2px rgba(14, 165, 233, 0.4); } .smart-guide.v { width: 1px; top: 0; bottom: 0; margin-left: -0.5px; } .smart-guide.h { height: 1px; left: 0; right: 0; margin-top: -0.5px; }

    .inspector-tabs { display: grid; grid-template-columns: repeat(2, 1fr); padding: 10px; gap: 8px; border-bottom: 1px solid var(--line); } .inspector-tabs button { min-height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-solid); color: var(--muted); font-weight: 800; } .inspector-tabs button.active { color: #fff; background: var(--navy-2); border-color: var(--navy-2); }

<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M7 4h10l3 3v13H7a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z" stroke="#e8c978" stroke-width="1.6"/><path d="M9 10h6M9 14h8M9 18h5" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>
        <div class="brand-title"><strong>محرر التقارير الرسمية A4</strong><span>تصميم، طبقات، قوالب، وتصدير دقيق</span></div>
      </div>
      <div class="toolbar-group toolbar-center">
        <button class="icon-btn" id="undoBtn" title="تراجع" disabled data-action="undo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 14 4 9l5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10a7 7 0 1 1 0 14h-1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button class="icon-btn" id="redoBtn" title="إعادة" disabled data-action="redo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m15 14 5-5-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 9H10a7 7 0 1 0 0 14h1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button class="icon-btn" title="تكبير" data-action="zoomIn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.2-4.2M11 8v6M8 11h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <span id="zoomLabel" class="kbd">85%</span>
        <button class="icon-btn" title="تصغير" data-action="zoomOut"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.2-4.2M8 11h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button class="text-btn" data-action="togglePreviewAll" id="previewAllBtn">معاينة الكل</button>
        <button class="text-btn" data-action="toggleGrid" id="gridBtn">الشبكة</button>
      </div>
      <div class="toolbar-group toolbar-actions">
        <button class="icon-btn" data-action="toggleTheme" title="الوضع الليلي"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 13.4A8.5 8.5 0 1 1 10.6 3 7 7 0 0 0 21 13.4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
        <button class="text-btn" data-action="restoreAutosave">استعادة</button>
        <button class="text-btn" data-action="openProject">فتح JSON</button>
        <button class="text-btn" data-action="saveProject">حفظ JSON</button>
        <button class="primary-btn" data-action="exportPdf"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0 4-4m-4 4-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>تصدير PDF</button>
      </div>
    </header>

    <main class="main">
      <aside class="panel left-panel">
        <section class="panel-section">
          <div class="section-title"><h2>العناصر</h2><small>أضف أو ارفع مباشرة</small></div>
          <div class="element-grid">
            <button class="tool-card" data-add="text"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M12 6v16M8 22h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>نص</span></button>
            <button class="tool-card" data-action="uploadLogo"><svg viewBox="0 0 24 24" fill="none"><path d="M5 5h14v14H5z" stroke="currentColor" stroke-width="2"/><path d="m8 16 3-4 2 3 2-2 2 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="9" r="1.4" fill="currentColor"/></svg><span>رفع شعار</span></button>
            <button class="tool-card" data-action="uploadImage"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v14H4z" stroke="currentColor" stroke-width="2"/><path d="m6 17 5-6 3 4 2-2 2 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>رفع صورة</span></button>
            <button class="tool-card" data-add="shape"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="5" width="14" height="14" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 8h8v8H8z" stroke="currentColor" stroke-width="1.4" opacity=".55"/></svg><span>شكل</span></button>
            <button class="tool-card" data-add="line"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12h16M7 8h10M9 16h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>خط زخرفي</span></button>
            <button class="tool-card" data-add="icon"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3 14.8 9l6.2.7-4.6 4.2 1.2 6.1L12 16.8 6.4 20l1.2-6.1L3 9.7 9.2 9 12 3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>أيقونة</span></button>
            <button class="tool-card" data-add="table"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v16H4zM4 10h16M4 15h16M10 5v16M16 5v16" stroke="currentColor" stroke-width="1.8"/></svg><span>جدول</span></button>
            <button class="tool-card" data-add="box"><svg viewBox="0 0 24 24" fill="none"><path d="M5 5h14v14H5z" stroke="currentColor" stroke-width="2"/><path d="M8 9h8M8 13h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>مربع محتوى</span></button>
            <button class="tool-card" data-action="uploadFont" style="grid-column:1/-1"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0-3-3m3 3 3-3M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="12" y="23" text-anchor="middle" style="font-size:5px;fill:currentColor">A ع</text></svg><span>⬆ رفع خط مخصص (TTF/OTF)</span></button>
          </div>
        </section>
        <section class="panel-section">
          <div class="section-title"><h2>القوالب</h2><small>إضافة صفحة جاهزة</small></div>
          <div class="template-list" id="templateList"></div>
        </section>
      </aside>

      <section class="workspace">
        <aside class="page-rail">
          <div class="page-actions">
            <button class="rail-btn" data-action="addPage">+ صفحة</button>
            <button class="rail-btn" data-action="duplicatePage">تكرار</button>
            <button class="rail-btn" data-action="deletePage">حذف</button>
            <button class="rail-btn" data-action="movePageUp">أعلى</button>
            <button class="rail-btn" data-action="movePageDown">أسفل</button>
          </div>
          <div class="page-thumbs" id="pageThumbs"></div>
        </aside>
        <section class="stage-shell">
          <div class="stage-meta">
            <div><strong id="activePageName">صفحة</strong><span class="dim-text"> · A4 Portrait · 210mm × 297mm</span></div>
            <div class="stage-controls"><span id="autosaveStatus">جاهز</span></div>
          </div>
          <div class="stage" id="stage"><div class="page-stack" id="pageStack"></div></div>
        </section>
      </section>

      <aside class="panel right-panel">
        <div class="inspector-tabs"><button class="active" data-tab="properties">الخصائص</button><button data-tab="layers">الطبقات</button></div>
        <div class="inspector-body"><section class="panel-section" id="propertiesPanel"></section><section class="panel-section" id="layersPanel" hidden></section></div>
      </aside>
    </main>
  </div>

  <input class="hidden-input" id="imageInput" type="file" accept="image/png, image/jpeg, image/webp, image/svg+xml">
  <input class="hidden-input" id="projectInput" type="file" accept="application/json,.json">
  <input class="hidden-input" id="fontInput" type="file" accept=".ttf,.otf,.woff,.woff2" multiple>
  <div class="toast" id="toast"></div>

  <div class="exporting-overlay" id="exportOverlay">
    <div class="export-card">
      <strong>جاري تصدير التقرير إلى PDF</strong>
      <p id="exportText">تهيئة محرك التصدير...</p>
      <div class="progress"><span id="exportProgress"></span></div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";
      const A4 = Object.freeze({ w: 210, h: 297 });
      const STORE_KEY = "premium-a4-report-editor-autosave-v1";
      const dom = {}; const history = { past: [], future: [], muted: false };
      const fileIntent = { type: null, targetId: null }; let operation = null, autosaveTimer = null, activeTextEdit = null;

      const state = { version: 1, activePageId: null, selectedId: null, zoom: 0.85, previewAll: false, showGrid: false, dark: false, inspectorTab: "properties", pages: [] };

      const templates = [
        { id: "cover", title: "غلاف تقرير رسمي", desc: "عنوان كبير، جهة، تاريخ، شريط ذهبي" },
        { id: "text", title: "صفحة نصوص", desc: "عنوان وفقرة ومربع ملخص" },
        { id: "images", title: "صفحة صور", desc: "شبكة صور وتعليقات" },
        { id: "closing", title: "صفحة ختامية", desc: "ختم وتوقيع ومعلومات تواصل" }
      ];

      const ICONS = {
        star: `<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />`,
        phone: `<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>`,
        email: `<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>`,
        location: `<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>`,
        check: `<polyline points="20 6 9 17 4 12"/>`,
        user: `<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>`
      };

      document.addEventListener("DOMContentLoaded", init);
      window.loadSystemFonts = loadSystemFonts;

      function init() {
        cacheDom(); bindGlobalEvents();
        state.pages = [createTemplatePage("cover")];
        state.activePageId = state.pages[0].id;
        pushHistory("init"); render();
      }

      function cacheDom() {
        dom.pageStack = document.getElementById("pageStack"); dom.pageThumbs = document.getElementById("pageThumbs");
        dom.propertiesPanel = document.getElementById("propertiesPanel"); dom.layersPanel = document.getElementById("layersPanel");
        dom.templateList = document.getElementById("templateList"); dom.zoomLabel = document.getElementById("zoomLabel");
        dom.activePageName = document.getElementById("activePageName"); dom.autosaveStatus = document.getElementById("autosaveStatus");
        dom.imageInput = document.getElementById("imageInput"); dom.projectInput = document.getElementById("projectInput");
        dom.fontInput = document.getElementById("fontInput");
        dom.exportOverlay = document.getElementById("exportOverlay"); dom.exportText = document.getElementById("exportText");
        dom.exportProgress = document.getElementById("exportProgress"); dom.toast = document.getElementById("toast");
        dom.undoBtn = document.getElementById("undoBtn"); dom.redoBtn = document.getElementById("redoBtn");
      }

      function bindGlobalEvents() {
        document.addEventListener("click", handleDocumentClick); document.addEventListener("input", handleDocumentInput);
        document.addEventListener("change", handleDocumentChange); document.addEventListener("keydown", handleKeydown);
        document.addEventListener("pointermove", handlePointerMove); document.addEventListener("pointerup", endOperation);
        dom.imageInput.addEventListener("change", handleImageFile); dom.projectInput.addEventListener("change", handleProjectFile);
        dom.fontInput.addEventListener("change", handleFontUpload);
      }

      function handleDocumentClick(event) {
        const actionTarget = event.target.closest("[data-action]");
        if (actionTarget) { runAction(actionTarget.dataset.action, actionTarget); return; }
        const addTarget = event.target.closest("[data-add]");
        if (addTarget) { addElement(addTarget.dataset.add); return; }
        const templateTarget = event.target.closest("[data-template]");
        if (templateTarget) { addTemplatePage(templateTarget.dataset.template); return; }
        const tabTarget = event.target.closest("[data-tab]");
        if (tabTarget) { state.inspectorTab = tabTarget.dataset.tab; renderInspector(); return; }
        const pageTarget = event.target.closest("[data-page-id]");
        if (pageTarget && !event.target.closest(".canvas-element")) { setActivePage(pageTarget.dataset.pageId); return; }
        const elementTarget = event.target.closest(".canvas-element");
        if (elementTarget) { selectElement(elementTarget.dataset.id); return; }
        if (event.target.closest(".stage")) { state.selectedId = null; render(); }
      }

      function handleDocumentInput(event) {
        if (!event.target.matches("[data-prop]")) {
          if (event.target.matches("[data-page-prop]")) updatePageProperty(event.target.dataset.pageProp, event.target.value, { live: true });
          return;
        }
        const prop = event.target.dataset.prop;
        const val = event.target.value;

        if (prop === "content") {
          const el = getSelected(); if (!el) return;
          el.content = val;
          if (el.type === "table") {
            const contentNode = document.querySelector(`[data-content="${el.id}"]`);
            if (contentNode) contentNode.innerHTML = buildElementContent(el);
          } else {
            const textNode = document.querySelector(`[data-content="${el.id}"] .text-element`) ||
                             document.querySelector(`[data-content="${el.id}"] .box-element > div`);
            if (textNode && textNode.contentEditable !== "true") {
              textNode.innerHTML = formatMultiline(val);
            }
          }
          scheduleAutosave();
        } else if (["style.cols", "style.rows", "style.headerBg", "style.headerColor", "style.tableBg", "style.borderColor", "style.fontSize"].includes(prop)) {
          updateSelectedProperty(prop, val, event.target, { live: true });
          const el = getSelected();
          if (el?.type === "table") {
            const contentNode = document.querySelector(`[data-content="${el.id}"]`);
            if (contentNode) contentNode.innerHTML = buildElementContent(el);
          }
          if (["style.cols", "style.rows"].includes(prop)) renderProperties(); // Update mini spreadsheet
        } else {
          updateSelectedProperty(prop, val, event.target, { live: true });
        }
      }

      function handleDocumentChange(event) {
        if (!event.target.matches("[data-prop]")) return;
        const prop = event.target.dataset.prop;
        if (prop === "style.fontFamily") {
          updateSelectedProperty(prop, event.target.value, event.target, { live: true });
          event.target.style.fontFamily = `"${event.target.value}"`;
        } else {
          updateSelectedProperty(prop, event.target.value, event.target, { live: false });
        }
      }

      function handleKeydown(event) {
        const activeTag = (document.activeElement && document.activeElement.tagName || "").toLowerCase();
        const isTyping = ["input", "textarea", "select"].includes(activeTag) || document.activeElement?.isContentEditable;
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "s") { event.preventDefault(); downloadProject(); return; }
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "d") { event.preventDefault(); duplicateSelected(); return; }
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "z") { event.preventDefault(); event.shiftKey ? redo() : undo(); return; }
        const selected = getSelected(); if (!selected || selected.locked || isTyping) return;
        if (event.key === "Delete" || event.key === "Backspace") { event.preventDefault(); deleteSelected(); return; }
        const step = event.shiftKey ? 5 : 1; const map = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
        if (map[event.key]) { event.preventDefault(); const [dx, dy] = map[event.key]; selected.x = clamp(round(selected.x + dx), 0, A4.w - selected.w); selected.y = clamp(round(selected.y + dy), 0, A4.h - selected.h); commit("move-key"); }
      }

      function runAction(action) {
        const actions = {
          addPage, duplicatePage, deletePage, movePageUp, movePageDown,
          duplicateSelected, deleteSelected, bringToFront, sendToBack, bringForward, sendBackward, toggleLockSelected, toggleSelectedVisibility,
          saveProject: downloadProject, openProject: () => dom.projectInput.click(), restoreAutosave, exportPdf,
          uploadLogo: () => { fileIntent.type = "logo"; dom.imageInput.accept = "image/png,image/jpeg,image/webp,image/svg+xml"; dom.imageInput.value = ""; dom.imageInput.click(); },
          uploadImage: () => { fileIntent.type = "image"; dom.imageInput.accept = "image/png,image/jpeg,image/webp,image/svg+xml"; dom.imageInput.value = ""; dom.imageInput.click(); },
          uploadFont: () => { dom.fontInput.value = ""; dom.fontInput.click(); },
          zoomIn: () => setZoom(state.zoom + .05), zoomOut: () => setZoom(state.zoom - .05),
          toggleTheme: () => { state.dark = !state.dark; render(); }, togglePreviewAll: () => { state.previewAll = !state.previewAll; render(); },
          toggleGrid, undo, redo
        };
        if (actions[action]) actions[action]();
      }

      function render() {
        document.body.classList.toggle("dark", state.dark);
        renderTemplates(); renderPages(); renderPageThumbs(); renderInspector(); updateToolbar();
      }

      function renderTemplates() {
        dom.templateList.innerHTML = templates.map(t => `<button class="template-card" data-template="${t.id}"><span class="template-mini"></span><span><strong>${escapeHtml(t.title)}</strong><span>${escapeHtml(t.desc)}</span></span></button>`).join("");
      }

      function renderPages() {
        if (activeTextEdit) return;
        const pages = state.previewAll ? state.pages : [getActivePage()].filter(Boolean);
        dom.pageStack.innerHTML = pages.map((page, i) => `
          <div class="page-frame" style="transform:scale(${state.zoom}); margin-bottom:${(state.zoom - 1) * 297}mm">
            <div class="page-caption"><strong>${escapeHtml(page.name || ("صفحة " + (i + 1)))}</strong><span>${state.pages.indexOf(page) + 1} / ${state.pages.length}</span></div>
            ${buildPageHtml(page, { interactive: true })}
          </div>
        `).join("");
        
        dom.pageStack.querySelectorAll(".canvas-element").forEach(node => {
          node.addEventListener("pointerdown", startElementOperation);
          node.addEventListener("dblclick", (e) => {
            const elId = e.currentTarget.dataset.id;
            const el = getElementById(elId);
            if (!el || el.locked) return;
            if (["text", "box"].includes(el.type)) { enableTextEdit(e); } 
            else if (["image", "logo", "external"].includes(el.type)) {
              e.stopPropagation(); fileIntent.type = "replace"; fileIntent.targetId = elId;
              dom.imageInput.accept = "image/png,image/jpeg,image/webp,image/svg+xml"; dom.imageInput.value = ""; dom.imageInput.click();
            }
          });
        });
        dom.activePageName.textContent = getActivePage()?.name || "صفحة";
      }

      function buildPageHtml(page, opts = {}) {
        return `<div class="report-page ${opts.interactive && page.id === state.activePageId ? "selected-page" : ""} ${state.showGrid ? "show-grid" : ""}" data-page-id="${page.id}">
            <div class="page-grid"></div><div id="guides-container"></div>
            ${getSortedElements(page).map(el => buildElementHtml(el, page, opts.interactive)).join("")}
          </div>`;
      }

      function buildElementHtml(element, page, interactive) {
        const isSel = interactive && element.id === state.selectedId && page.id === state.activePageId;
        const style = `left:${element.x}mm; top:${element.y}mm; width:${element.w}mm; height:${element.h}mm; z-index:${element.z}; opacity:${element.opacity}; transform:rotate(${element.rotation}deg)`;
        return `<div class="canvas-element ${isSel ? "selected" : ""} ${element.hidden ? "hidden-layer" : ""} ${element.locked ? "locked" : ""}" data-id="${element.id}" style="${style}">
            <div class="element-content" data-content="${element.id}">${buildElementContent(element)}</div>
            ${isSel && !element.locked ? `<span class="rotate-handle" data-handle="rotate"></span><span class="resize-handle nw" data-handle="nw"></span><span class="resize-handle n" data-handle="n"></span><span class="resize-handle ne" data-handle="ne"></span><span class="resize-handle e" data-handle="e"></span><span class="resize-handle se" data-handle="se"></span><span class="resize-handle s" data-handle="s"></span><span class="resize-handle sw" data-handle="sw"></span><span class="resize-handle w" data-handle="w"></span>` : ""}
          </div>`;
      }

      function buildElementContent(element) {
        const s = element.style || {};
        if (element.type === "text") return `<div class="text-element" style="${textStyle(s)}">${formatMultiline(element.content || "")}</div>`;
        if (["image", "logo", "external"].includes(element.type)) return `<img src="${element.src || placeholderImage(element.type)}" style="width:100%;height:100%;display:block;object-fit:${s.objectFit || "contain"};object-position:${s.objectX ?? 50}% ${s.objectY ?? 50}%;border-radius:${s.radius || 0}mm;border:${s.borderWidth || 0}mm solid ${s.borderColor || "transparent"};box-shadow:${s.shadow || "none"};pointer-events:none;" crossorigin="anonymous">`;
        if (element.type === "shape") return `<div class="shape-element" style="background:${s.fill || "#f4f6fa"};border:${s.borderWidth || 0.4}mm solid ${s.borderColor || "#c6a05a"};border-radius:${s.shape === "circle" ? "999mm" : (s.radius || 0) + "mm"};"></div>`;
        if (element.type === "line") return `<div class="line-element" style="background:linear-gradient(90deg, transparent, ${s.color || "#c6a05a"}, transparent);height:${s.stroke || 1}mm;margin-top:${Math.max(0, (element.h - (s.stroke || 1)) / 2)}mm"></div>`;
        if (element.type === "box") return `<div class="box-element" style="background:${s.fill || "#ffffff"};border:${s.borderWidth || .35}mm solid ${s.borderColor || "#d9dee8"};border-radius:${s.radius || 4}mm;padding:5mm;display:block;"><div style="${textStyle(s)}">${formatMultiline(element.content || "")}</div></div>`;
        if (element.type === "icon") return `<div class="icon-element" style="color:${s.color || '#172033'};"><svg viewBox="0 0 24 24" style="stroke-width:${s.strokeWidth || 1.8};">${ICONS[element.iconType || "star"]}</svg></div>`;
        if (element.type === "table") return buildTableHtml(element);
        return "";
      }

      function buildDefaultTableContent(cols, rows) {
        const header = Array.from({ length: cols }, (_, i) => `العمود ${i + 1}`);
        const dataRows = Array.from({ length: rows - 1 }, (_, r) => Array.from({ length: cols }, (_, c) => `بيانات`));
        return JSON.stringify([header, ...dataRows]);
      }

      function parseTableContent(content, cols, rows) {
        if (!content) return null;
        try { const parsed = JSON.parse(content); if (Array.isArray(parsed)) return parsed; } catch(e) {}
        return content.split("\n").map(row => row.split(",").map(c => c.trim()));
      }

      function buildTableHtml(element) {
        const s = element.style || {};
        const cols = Math.max(1, Math.min(20, s.cols || 3)); const rows = Math.max(2, Math.min(100, s.rows || 4));
        const headerBg = s.headerBg || "#071d3d"; const headerColor = s.headerColor || "#ffffff";
        const tableBg = s.tableBg || "#ffffff"; const borderColor = s.borderColor || "#bfc7d6"; const fontSize = s.fontSize || 13;
        const data = parseTableContent(element.content, cols, rows) || Array.from({ length: rows }, (_, r) => Array.from({ length: cols }, (_, c) => r === 0 ? `العمود ${c+1}` : `بيانات`));

        const tStyle = `width:100%;height:100%;border-collapse:collapse;table-layout:fixed;direction:rtl;background:${tableBg};font-size:${fontSize}px;`;
        let html = `<table class="table-element" style="${tStyle}">`;
        for (let r = 0; r < Math.min(rows, data.length); r++) {
          const rowData = data[r] || []; html += "<tr>";
          for (let c = 0; c < cols; c++) {
            const cell = escapeHtml(rowData[c] != null ? String(rowData[c]) : "");
            const isHeader = r === 0;
            const cellStyle = `border:1px solid ${borderColor};padding:2mm;vertical-align:top;font-size:${fontSize}px;${isHeader ? `background:${headerBg};color:${headerColor};font-weight:800;` : `background:${r%2===0 ? tableBg : "rgba(7,29,61,0.03)"};color:#172033;`}`;
            html += `<${isHeader ? "th" : "td"} style="${cellStyle}">${cell}</${isHeader ? "th" : "td"}>`;
          }
          html += "</tr>";
        }
        html += "</table>"; return html;
      }

      function renderPageThumbs() {
        dom.pageThumbs.innerHTML = state.pages.map((p, i) => `<button class="page-thumb ${p.id === state.activePageId ? "active" : ""}" data-page-id="${p.id}"><div class="thumb-paper"></div><div class="page-thumb-title"><strong>${escapeHtml(p.name)}</strong><span>${i + 1}</span></div></button>`).join("");
      }

      function renderInspector() {
        document.querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("active", b.dataset.tab === state.inspectorTab));
        dom.propertiesPanel.hidden = state.inspectorTab !== "properties"; dom.layersPanel.hidden = state.inspectorTab !== "layers";
        renderProperties();
      }

      const FONT_LIST = [
        { label: "Cairo (كايرو)", value: "Cairo" }, { label: "Tajawal (تجوال)", value: "Tajawal" }, { label: "Almarai (المراعي)", value: "Almarai" },
        { label: "Mada (مادا)", value: "Mada" }, { label: "Changa (شانجا)", value: "Changa" }, { label: "El Messiri (المسيري)", value: "El Messiri" },
        { label: "Noto Sans Arabic", value: "Noto Sans Arabic" }, { label: "Noto Kufi Arabic", value: "Noto Kufi Arabic" },
        { label: "Markazi Text (مركزي)", value: "Markazi Text" }, { label: "Reem Kufi", value: "Reem Kufi" }, { label: "Amiri (أميري)", value: "Amiri" }
      ];
      const customFonts = [];

      async function loadSystemFonts() {
        if (!('queryLocalFonts' in window)) { toast("متصفحك لا يدعم جلب خطوط النظام تلقائياً (استخدم كروم أو إيدج)."); return; }
        try {
          const availableFonts = await window.queryLocalFonts();
          const fontNames = [...new Set(availableFonts.map(f => f.family))];
          fontNames.forEach(f => {
            if (!customFonts.find(cf => cf.name === f)) customFonts.push({ name: f, value: f, isSystem: true });
          });
          renderProperties(); toast(`تم تحميل ${fontNames.length} خط من جهازك بنجاح ✓`);
        } catch (err) { toast("تم رفض الصلاحية أو حدث خطأ أثناء جلب الخطوط."); }
      }

      function fontOptions(current) {
        const allFonts = [...FONT_LIST, ...customFonts.map(f => ({ label: `★ ${f.name}`, value: f.name }))];

      function downloadProject() { try { const json = JSON.stringify(serializeState(), null, 2); const blob = new Blob([json], { type: "application/json" }); const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.style.cssText = "position:absolute;left:-9999px;opacity:0;"; a.href = url; a.download = `report-${Date.now()}.json`; document.body.appendChild(a); a.click(); setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200); toast("تم حفظ المشروع بنجاح ✓"); } catch (e) { toast("حدث خطأ أثناء الحفظ."); } }
      function handleProjectFile(event) { const file = event.target.files?.[0]; if (!file) return; const reader = new FileReader(); reader.onload = () => { try { const parsed = JSON.parse(reader.result); loadState(parsed); if (parsed.zoom) state.zoom = parsed.zoom; if (typeof parsed.dark === "boolean") state.dark = parsed.dark; state.selectedId = null; commit("load"); toast("تم فتح المشروع بنجاح ✓"); } catch (e) { toast("فشل فتح الملف."); } }; reader.readAsText(file); event.target.value = ""; }
      function restoreAutosave() { try { const raw = localStorage.getItem(STORE_KEY); if (!raw) { toast("لا يوجد حفظ تلقائي."); return; } const parsed = JSON.parse(raw); loadState(parsed); if (parsed.zoom) state.zoom = parsed.zoom; state.selectedId = null; commit("restore"); toast("تمت استعادة الحفظ التلقائي ✓"); } catch(e) { toast("فشل الاستعادة."); } }

      let isExporting = false;
      async function waitForImages(root) { const imgs = Array.from(root.querySelectorAll("img")); await Promise.all(imgs.map(img => { if (img.complete && img.naturalWidth > 0) return Promise.resolve(); return new Promise(res => { img.onload = res; img.onerror = res; setTimeout(res, 3000); }); })); }
      async function exportPdf() {
        if (isExporting) return; if (!window.html2canvas || !window.jspdf?.jsPDF) { toast("المكتبات غير متوفرة."); return; }
        isExporting = true; const prev = state.selectedId; state.selectedId = null; render(); dom.exportOverlay.classList.add("active"); dom.exportText.textContent = "تهيئة محرك التصدير..."; dom.exportProgress.style.width = "0%";
        const root = document.createElement("div"); root.style.cssText = "position:fixed;top:0;left:-9999px;width:794px;background:#fff;z-index:-1;visibility:hidden;"; document.body.appendChild(root);
        try {
          if (document.fonts?.ready) await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2000))]);
          const { jsPDF } = window.jspdf; const pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4", compress: true });
          for (let i = 0; i < state.pages.length; i++) {
            dom.exportProgress.style.width = Math.round((i / state.pages.length) * 100) + "%"; dom.exportText.textContent = `جاري تصدير الصفحة ${i + 1}...`; root.innerHTML = buildPageHtml(state.pages[i], { interactive: false }); const node = root.querySelector(".report-page"); if (!node) continue;
            await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))); await waitForImages(node);
            const canvas = await window.html2canvas(node, { scale: 4, useCORS: true, allowTaint: true, backgroundColor: "#ffffff", logging: false, width: node.offsetWidth, height: node.offsetHeight }); const imgData = canvas.toDataURL("image/jpeg", 0.92); if (i > 0) pdf.addPage("a4", "portrait"); pdf.addImage(imgData, "JPEG", 0, 0, 210, 297, undefined, "FAST");
          }
          dom.exportProgress.style.width = "100%"; dom.exportText.textContent = "جاري حفظ الملف..."; await new Promise(r => setTimeout(r, 300)); pdf.save(`Official-Report-${Date.now()}.pdf`); toast("تم التصدير بنجاح ✓");
        } catch (err) { toast("فشل التصدير."); } finally { root.remove(); state.selectedId = prev; dom.exportOverlay.classList.remove("active"); isExporting = false; render(); }
      }

      function updateSelectedProperty(p, v, inp, opts={}) { const el = getSelected(); if (!el) return; const numFields = ["style.fontSize", "style.borderWidth", "style.radius", "x", "y", "w", "h", "rotation", "opacity"]; let val = numFields.includes(p) ? Number(v) : v; const parts = p.split("."); let t = el; for (let i = 0; i < parts.length - 1; i++) { t[parts[i]] = t[parts[i]] || {}; t = t[parts[i]]; } t[parts[parts.length - 1]] = val; if (opts.live) { updateElementInDOM(el); scheduleAutosave(); } else { commit("prop"); } }
      function addElement(type, over={}) { const p = getActivePage(); if (!p) return; const defaults = { text: { w: 80, h: 24, style: { fontSize: 18, color: "#172033", fontFamily: "Cairo", fontWeight: "normal", textAlign: "right", lineHeight: 1.5 }, content: "نص جديد" }, box: { w: 90, h: 40, style: { fontSize: 14, color: "#172033", fontFamily: "Cairo", fill: "#f7f8fb", borderColor: "#d9dee8", borderWidth: 0.35, radius: 4, lineHeight: 1.5 }, content: "محتوى المربع" }, table: { w: 160, h: 60, style: { cols: 3, rows: 4, fontSize: 13, headerBg: "#071d3d", headerColor: "#ffffff", tableBg: "#ffffff", borderColor: "#bfc7d6" }, content: "" }, shape: { w: 50, h: 50, style: { fill: "#f4f6fa", borderColor: "#c6a05a", borderWidth: 0.4, radius: 0 } }, line: { w: 120, h: 5, style: { color: "#c6a05a", stroke: 1 } }, image: { w: 92, h: 64, style: { objectFit: "contain" } }, logo: { w: 34, h: 34, style: { objectFit: "contain" } }, icon: { w: 24, h: 24, iconType: "star", style: { color: "#c6a05a", strokeWidth: 1.8 } } }; const d = defaults[type] || {}; const el = { id: uid("el"), type, name: type, x: 20, y: 20, rotation: 0, opacity: 1, z: p.elements.length + 1, style: {}, ...d, ...over }; if (d.style) el.style = { ...d.style, ...(over.style || {}) }; if (type === "table" && !el.content) el.content = buildDefaultTableContent(el.style.cols || 3, el.style.rows || 4); p.elements.push(el); state.selectedId = el.id; commit("add"); }
      function addPage() { const p = { id: uid("pg"), name: "صفحة", elements: [] }; state.pages.push(p); state.activePageId = p.id; commit("add-pg"); } function addTemplatePage(id) { const p = { id: uid("pg"), name: "قالب", elements: [{id:uid("e"), type:"text", content:"قالب جاهز", x:20, y:20, w:100, h:20, style:{fontSize:24}}] }; state.pages.push(p); state.activePageId = p.id; commit("tpl"); } function duplicateSelected() { const p=getActivePage(); const el=getSelected(); if(!p||!el)return; const c=JSON.parse(JSON.stringify(el)); c.id=uid("el"); c.x+=6; c.y+=6; c.z=p.elements.length+1; p.elements.push(c); state.selectedId=c.id; commit("dup"); } function deleteSelected() { const p=getActivePage(); if(!p||!state.selectedId)return; p.elements = p.elements.filter(e=>e.id!==state.selectedId); state.selectedId=null; commit("del"); } function bringForward() { const p=getActivePage(); const el=getSelected(); if(el) { el.z += 1.5; normalizeZ(p); commit("z"); } } function sendBackward() { const p=getActivePage(); const el=getSelected(); if(el) { el.z -= 1.5; normalizeZ(p); commit("z"); } } function getActivePage() { return state.pages.find(p=>p.id===state.activePageId) || state.pages[0]; } function getSelected() { return getActivePage()?.elements.find(e=>e.id===state.selectedId); } function getSortedElements(p) { return [...p.elements].sort((a,b)=>a.z-b.z); } function normalizeZ(p) { p.elements.sort((a,b)=>a.z-b.z).forEach((e,i)=>e.z=i+1); } function createTemplatePage(t) { return { id: uid("pg"), name: "الغلاف", elements: [{id:uid("e"), type:"text", content:"تقرير الأداء", x:40, y:80, w:120, h:30, style:{ fontSize:28, fontWeight:800, color:"#071d3d" }}] }; } function textStyle(s) { return `font-family:${s.fontFamily ? `"${s.fontFamily}"` : '"Cairo"'}; font-size:${s.fontSize || 14}px; color:${s.color || "#000"}; font-weight:${s.fontWeight || "normal"}; font-style:${s.fontStyle || "normal"}; text-align:${s.textAlign || "right"}; line-height:${s.lineHeight || 1.5}`; } function placeholderImage(t) { return `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="%23ddd"/><text x="100" y="100" text-anchor="middle" font-size="20" fill="%23555">${t}</text></svg>`; } function formatMultiline(t) { return escapeHtml(t).replace(/\n/g,"<br>"); } function escapeHtml(v) { return String(v??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])); } function uid(p) { return p+"-"+Math.random().toString(36).substr(2,6); } function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); } function round(v) { return Math.round(Number(v)*100)/100; } function setZoom(v) { state.zoom = clamp(Number(v), .4, 1.5); render(); } function scheduleAutosave() { clearTimeout(autosaveTimer); autosaveTimer = setTimeout(()=>{ try { localStorage.setItem(STORE_KEY, JSON.stringify(serializeState())); dom.autosaveStatus.textContent="تم الحفظ تلقائياً"; } catch(e) {} }, 500); } function pushHistory(lbl) { commit(lbl); } function serializeState() { return { ...state, pages: state.pages }; } function commit(lbl) { scheduleAutosave(); history.past.push(JSON.stringify(serializeState())); if(history.past.length>60) history.past.shift(); history.future=[]; updateToolbar(); render(); } function undo() { if(history.past.length>1) { history.future.push(history.past.pop()); loadState(JSON.parse(history.past[history.past.length-1])); render(); } } function redo() { if(history.future.length) { const s = history.future.pop(); history.past.push(s); loadState(JSON.parse(s)); render(); } } function loadState(s) { state.pages = s.pages; state.activePageId = s.activePageId ?? (s.pages?.[0]?.id); state.selectedId = s.selectedId ?? null; if(s.zoom) state.zoom=s.zoom; if(typeof s.dark==="boolean") state.dark=s.dark; } function toast(m) { const d=document.createElement("div"); d.className="toast-item"; d.textContent=m; dom.toast.appendChild(d); setTimeout(()=>{ d.style.opacity="0"; setTimeout(()=>d.remove(), 200); }, 3000); }
      function getElementById(id) { return getActivePage()?.elements.find(e=>e.id===id); } function selectElement(id, opts={}) { state.selectedId = id; if (opts.render !== false) render(); else renderProperties(); } function setActivePage(id) { state.activePageId = id; state.selectedId = null; render(); } function duplicatePage() { const p = getActivePage(); if (!p) return; const c = JSON.parse(JSON.stringify(p)); c.id = uid("pg"); c.name = c.name + " (نسخة)"; c.elements.forEach(e => e.id = uid("el")); const idx = state.pages.indexOf(p); state.pages.splice(idx+1, 0, c); state.activePageId = c.id; commit("dup-pg"); } function deletePage() { if (state.pages.length <= 1) { toast("لا يمكن حذف الصفحة الوحيدة."); return; } const idx = state.pages.findIndex(p=>p.id===state.activePageId); state.pages.splice(idx, 1); state.activePageId = state.pages[Math.max(0, idx-1)].id; state.selectedId = null; commit("del-pg"); } function movePageUp() { const idx = state.pages.findIndex(p=>p.id===state.activePageId); if (idx > 0) { [state.pages[idx-1], state.pages[idx]] = [state.pages[idx], state.pages[idx-1]]; commit("move-pg"); } } function movePageDown() { const idx = state.pages.findIndex(p=>p.id===state.activePageId); if (idx < state.pages.length-1) { [state.pages[idx+1], state.pages[idx]] = [state.pages[idx], state.pages[idx+1]]; commit("move-pg"); } } function bringToFront() { const p=getActivePage(); const el=getSelected(); if(el) { el.z=p.elements.length+1; normalizeZ(p); commit("z"); } } function sendToBack() { const p=getActivePage(); const el=getSelected(); if(el) { el.z=0; normalizeZ(p); commit("z"); } } function toggleLockSelected() { const el=getSelected(); if(el) { el.locked=!el.locked; commit("lock"); } } function toggleSelectedVisibility() { const el=getSelected(); if(el) { el.hidden=!el.hidden; commit("vis"); } } function toggleGrid() { state.showGrid=!state.showGrid; render(); } function updatePageProperty(prop, val, opts={}) { const p=getActivePage(); if(!p) return; p[prop]=val; if(opts.live) { scheduleAutosave(); renderPages(); } else commit("pg-prop"); }
      window.addEventListener("error", e => { console.error("[Editor Error]", e.message, e.filename, e.lineno); }); window.addEventListener("unhandledrejection", e => { console.error("[Unhandled Promise]", e.reason); toast("خطأ غير متوقع."); });
    })();

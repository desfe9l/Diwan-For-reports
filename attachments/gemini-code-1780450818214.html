<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>محرر التقارير الرسمية A4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha512-BNa5cWqV9Y3X4gUw3GZbAK331m7sqAInqJ5RTa5lzKzuz3q1Z0oxdCT+LYrwM36kwk6qK4mPHqP6rGmxyb3sEQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnYTdV5i8Jb3niEbQQxEW1P1luA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef1f5;
      --bg-2: #f7f8fb;
      --panel: rgba(255, 255, 255, .82);
      --panel-solid: #ffffff;
      --text: #172033;
      --muted: #697184;
      --line: #d9dee8;
      --line-strong: #bfc7d6;
      --navy: #071d3d;
      --navy-2: #102d57;
      --gold: #c6a05a;
      --gold-2: #e8c978;
      --accent: #2563eb;
      --paper: #ffffff;
      --danger: #c2413b;
      --success: #087f5b;
      --shadow: 0 18px 55px rgba(15, 23, 42, .18);
      --soft-shadow: 0 10px 30px rgba(15, 23, 42, .11);
      --radius: 8px;
      --toolbar-h: 64px;
      --left-w: 300px;
      --right-w: 358px;
      --thumb-w: 128px;
      --font-ui: "Tajawal", "Cairo", "IBM Plex Sans Arabic", "Noto Sans Arabic", Arial, sans-serif;
      --font-doc: "Tajawal", "Cairo", "Noto Sans Arabic", Arial, sans-serif;
    }

    body.dark {
      color-scheme: dark;
      --bg: #111722;
      --bg-2: #161d2a;
      --panel: rgba(28, 35, 49, .82);
      --panel-solid: #1b2433;
      --text: #edf2f7;
      --muted: #a8b0bf;
      --line: #344052;
      --line-strong: #4a5870;
      --navy: #08172c;
      --navy-2: #14315e;
      --gold: #caa85f;
      --gold-2: #f1d178;
      --paper: #ffffff;
      --shadow: 0 22px 65px rgba(0, 0, 0, .36);
      --soft-shadow: 0 10px 30px rgba(0, 0, 0, .22);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%; margin: 0; overflow: hidden; background: var(--bg);
      color: var(--text); font-family: var(--font-ui); font-size: 14px; letter-spacing: 0;
    }

    button, input, select, textarea { font: inherit; }
    button { border: 0; cursor: pointer; color: inherit; background: transparent; }
    button:disabled, input:disabled, select:disabled { cursor: not-allowed; opacity: .48; }

    .app {
      display: grid; grid-template-rows: var(--toolbar-h) minmax(0, 1fr); height: 100%; min-width: 1024px;
    }

    .topbar {
      display: grid; grid-template-columns: auto minmax(320px, 1fr) auto; align-items: center; gap: 16px;
      height: var(--toolbar-h); padding: 0 16px;
      background: linear-gradient(90deg, rgba(7, 29, 61, .96), rgba(16, 45, 87, .95)), var(--navy);
      color: #fff; border-bottom: 1px solid rgba(255, 255, 255, .12); box-shadow: 0 8px 28px rgba(4, 11, 24, .22); z-index: 40;
    }

    .brand { display: inline-flex; align-items: center; gap: 12px; min-width: 260px; }
    .brand-mark {
      width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid rgba(232, 201, 120, .58);
      border-radius: 8px; background: linear-gradient(135deg, rgba(198, 160, 90, .24), rgba(255, 255, 255, .08));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18); flex: 0 0 auto;
    }
    .brand-title { display: grid; gap: 2px; line-height: 1.1; }
    .brand-title strong { font-size: 15px; font-weight: 800; }
    .brand-title span { font-size: 11px; color: rgba(255, 255, 255, .68); }

    .toolbar-group { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .toolbar-center { justify-content: center; overflow: hidden; }
    .toolbar-actions { justify-content: flex-end; }

    .icon-btn, .text-btn, .primary-btn, .danger-btn, .ghost-btn {
      height: 36px; min-width: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      border-radius: 8px; border: 1px solid rgba(255, 255, 255, .18); background: rgba(255, 255, 255, .08);
      color: #fff; padding: 0 10px; white-space: nowrap; transition: background .16s ease, border-color .16s ease, transform .16s ease, box-shadow .16s ease;
    }
    .icon-btn:hover, .text-btn:hover, .ghost-btn:hover { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .28); }

    .primary-btn {
      color: #09182c; background: linear-gradient(135deg, var(--gold-2), var(--gold)); border-color: rgba(255, 255, 255, .16);
      box-shadow: 0 8px 18px rgba(198, 160, 90, .24); font-weight: 800;
    }
    .primary-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(198, 160, 90, .32); }
    .danger-btn { background: rgba(194, 65, 59, .14); border-color: rgba(255, 255, 255, .16); color: #fff; }

    .main {
      display: grid; grid-template-columns: var(--left-w) minmax(0, 1fr) var(--right-w); min-height: 0;
      background: radial-gradient(circle at 20% 0%, rgba(198, 160, 90, .08), transparent 30%), linear-gradient(180deg, var(--bg-2), var(--bg));
    }

    .panel { min-height: 0; overflow: auto; background: var(--panel); border-left: 1px solid var(--line); border-right: 1px solid var(--line); backdrop-filter: blur(18px); }
    .left-panel { border-right: 0; box-shadow: -6px 0 24px rgba(15, 23, 42, .05); }
    .right-panel { border-left: 0; box-shadow: 6px 0 24px rgba(15, 23, 42, .05); }

    .panel-section { padding: 14px; border-bottom: 1px solid var(--line); }
    .section-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; color: var(--text); }
    .section-title h2, .section-title h3 { margin: 0; font-size: 13px; font-weight: 800; }
    .section-title small { color: var(--muted); font-size: 11px; }

    .element-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

    .tool-card, .template-card, .layer-row, .page-thumb, .mini-control {
      border: 1px solid var(--line); border-radius: 8px; background: rgba(255, 255, 255, .58); color: var(--text);
    }
    body.dark .tool-card, body.dark .template-card, body.dark .layer-row, body.dark .page-thumb, body.dark .mini-control {
      background: rgba(255, 255, 255, .045);
    }

    .tool-card { height: 72px; display: grid; align-content: center; justify-items: center; gap: 6px; padding: 8px; transition: border-color .16s ease, transform .16s ease, background .16s ease; }
    .tool-card svg { width: 24px; height: 24px; stroke: var(--navy-2); }
    body.dark .tool-card svg { stroke: var(--gold-2); }
    .tool-card span { font-size: 12px; font-weight: 700; }
    .tool-card:hover, .template-card:hover, .page-thumb:hover {
      border-color: var(--gold); background: rgba(198, 160, 90, .10); transform: translateY(-1px);
    }

    .template-list { display: grid; gap: 8px; }
    .template-card { display: grid; grid-template-columns: 42px minmax(0, 1fr); align-items: center; gap: 10px; padding: 10px; text-align: right; }
    .template-mini {
      width: 42px; height: 54px; border-radius: 4px; background: #fff; border: 1px solid var(--line); position: relative; overflow: hidden; box-shadow: 0 4px 10px rgba(15, 23, 42, .08);
    }
    .template-mini::before {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 0 56%, rgba(198, 160, 90, .22) 56% 62%, transparent 62%), linear-gradient(180deg, rgba(7, 29, 61, .12), transparent 36%);
    }
    .template-card strong { display: block; margin-bottom: 2px; font-size: 12px; }
    .template-card span { color: var(--muted); font-size: 11px; }

    .workspace { display: grid; grid-template-columns: var(--thumb-w) minmax(0, 1fr); min-width: 0; min-height: 0; overflow: hidden; }
    .page-rail { min-height: 0; overflow: auto; padding: 14px 10px; border-left: 1px solid var(--line); background: rgba(255, 255, 255, .42); }
    body.dark .page-rail { background: rgba(255, 255, 255, .035); }

    .page-actions { display: grid; gap: 7px; margin-bottom: 12px; }
    .rail-btn {
      min-height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px;
      border: 1px solid var(--line); border-radius: 8px; color: var(--text); background: var(--panel-solid); font-size: 12px; font-weight: 700;
    }

    .page-thumbs { display: grid; gap: 10px; }
    .page-thumb { padding: 7px; text-align: right; position: relative; }
    .page-thumb.active { border-color: var(--gold); box-shadow: inset 3px 0 0 var(--gold); }
    .thumb-paper { width: 72px; height: 102px; margin: 0 auto 7px; background: #fff; border: 1px solid #d7dce7; box-shadow: 0 5px 14px rgba(15, 23, 42, .13); position: relative; overflow: hidden; }
    .thumb-paper span { position: absolute; border-radius: 2px; background: rgba(7, 29, 61, .2); }
    .page-thumb-title { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
    .page-thumb-title strong { max-width: 78px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-size: 12px; }

    .stage-shell { min-width: 0; min-height: 0; display: grid; grid-template-rows: 44px minmax(0, 1fr); }
    .stage-meta {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px;
      border-bottom: 1px solid var(--line); background: rgba(255, 255, 255, .45); color: var(--muted); font-size: 12px;
    }
    body.dark .stage-meta { background: rgba(255, 255, 255, .04); }
    .stage-controls { display: flex; align-items: center; gap: 8px; }

    .segmented { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-solid); }
    .segmented button { min-width: 34px; height: 28px; padding: 0 8px; border-radius: 6px; color: var(--muted); font-weight: 700; font-size: 12px; }
    .segmented button.active { background: var(--navy-2); color: #fff; }

    .stage {
      min-width: 0; min-height: 0; overflow: auto; padding: 34px 32px 60px; direction: ltr; background-color: var(--bg);
      background-image: linear-gradient(rgba(7, 29, 61, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(7, 29, 61, .06) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    body.dark .stage {
      background-image: linear-gradient(rgba(255, 255, 255, .045) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .045) 1px, transparent 1px);
    }

    .page-stack { width: max-content; min-width: 100%; display: flex; flex-direction: column; align-items: center; gap: 36px; direction: rtl; }
    .page-frame { transform-origin: top center; position: relative; }
    .page-caption { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; color: var(--muted); font-size: 12px; direction: rtl; }
    .page-caption strong { color: var(--text); font-size: 13px; }

    .report-page {
      width: 210mm; height: 297mm; position: relative; overflow: hidden; direction: rtl; color: #172033; background: var(--paper);
      box-shadow: var(--shadow); isolation: isolate; font-family: var(--font-doc); user-select: none;
    }
    .report-page::after { content: ""; position: absolute; inset: 0; pointer-events: none; border: 1px solid rgba(15, 23, 42, .08); z-index: 100000; }
    .report-page.selected-page { outline: 2px solid var(--gold); outline-offset: 8px; }

    .page-grid {
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background-image: linear-gradient(rgba(37, 99, 235, .09) 1px, transparent 1px), linear-gradient(90deg, rgba(37, 99, 235, .09) 1px, transparent 1px);
      background-size: 5mm 5mm; opacity: 0;
    }
    .report-page.show-grid .page-grid { opacity: 1; }

    .smart-guide { position: absolute; z-index: 99998; pointer-events: none; background: #0ea5e9; box-shadow: 0 0 0 1px rgba(14, 165, 233, .22); }
    .smart-guide.v { width: .35mm; top: 0; bottom: 0; }
    .smart-guide.h { height: .35mm; left: 0; right: 0; }

    .canvas-element {
      position: absolute; z-index: 1; transform-origin: center center; cursor: move; outline: 0 solid transparent; user-select: none; touch-action: none; min-width: 3mm; min-height: 3mm;
    }
    .canvas-element.hidden-layer { display: none; }
    .canvas-element.locked { cursor: not-allowed; }
    .canvas-element.selected { outline: .55mm solid rgba(37, 99, 235, .95); outline-offset: .8mm; }

    .element-content { width: 100%; height: 100%; overflow: hidden; position: relative; word-break: break-word; }
    .element-content.editing { user-select: text; cursor: text; }
    .element-content img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: center center; pointer-events: none; }

    .text-element { display: flex; align-items: flex-start; justify-content: flex-start; padding: 0; white-space: pre-wrap; }
    .text-element:focus { outline: 0; }

    .shape-element, .box-element, .stamp-element, .divider-element, .line-element { width: 100%; height: 100%; }
    .icon-element { width: 100%; height: 100%; display: grid; place-items: center; }
    .icon-element svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .stamp-element { display: grid; place-items: center; border-radius: 999px; text-align: center; font-weight: 800; line-height: 1.4; letter-spacing: 0; }

    .table-element { width: 100%; height: 100%; border-collapse: collapse; table-layout: fixed; direction: rtl; background: #fff; color: #172033; }
    .table-element td, .table-element th { border: 1px solid #bfc7d6; padding: 2mm; vertical-align: top; overflow: hidden; font-size: inherit; }
    .table-element th { background: #071d3d; color: #fff; font-weight: 800; }

    .resize-handle, .rotate-handle {
      position: absolute; z-index: 100002; display: none; background: #fff; border: .55mm solid #2563eb; box-shadow: 0 1px 4px rgba(15, 23, 42, .28); pointer-events: auto;
    }
    .selected .resize-handle, .selected .rotate-handle { display: block; }
    .resize-handle { width: 3.5mm; height: 3.5mm; border-radius: 50%; }
    .resize-handle.nw { top: -2.2mm; left: -2.2mm; cursor: nwse-resize; }
    .resize-handle.n { top: -2.2mm; left: calc(50% - 1.75mm); cursor: ns-resize; }
    .resize-handle.ne { top: -2.2mm; right: -2.2mm; cursor: nesw-resize; }
    .resize-handle.e { top: calc(50% - 1.75mm); right: -2.2mm; cursor: ew-resize; }
    .resize-handle.se { bottom: -2.2mm; right: -2.2mm; cursor: nwse-resize; }
    .resize-handle.s { bottom: -2.2mm; left: calc(50% - 1.75mm); cursor: ns-resize; }
    .resize-handle.sw { bottom: -2.2mm; left: -2.2mm; cursor: nesw-resize; }
    .resize-handle.w { top: calc(50% - 1.75mm); left: -2.2mm; cursor: ew-resize; }
    .rotate-handle { width: 5mm; height: 5mm; top: -11mm; left: calc(50% - 2.5mm); border-radius: 999px; cursor: grab; }
    .rotate-handle::before { content: ""; position: absolute; right: calc(50% - .25mm); top: 4.2mm; width: .5mm; height: 6mm; background: #2563eb; }

    .inspector-tabs { display: grid; grid-template-columns: repeat(2, 1fr); padding: 10px; gap: 8px; border-bottom: 1px solid var(--line); }
    .inspector-tabs button { min-height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-solid); color: var(--muted); font-weight: 800; }
    .inspector-tabs button.active { color: #fff; background: var(--navy-2); border-color: var(--navy-2); }
    .inspector-body { min-height: 0; }

    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .field { display: grid; gap: 5px; min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: var(--muted); font-size: 11px; font-weight: 800; }
    .field input, .field select, .field textarea { width: 100%; min-height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-solid); color: var(--text); padding: 7px 9px; outline: none; }
    .field textarea { min-height: 108px; resize: vertical; line-height: 1.55; }
    .field input[type="color"] { padding: 3px; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(198, 160, 90, .16); }

    .range-row { display: grid; grid-template-columns: minmax(0, 1fr) 56px; gap: 8px; align-items: center; }
    .action-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .panel-btn { min-height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-solid); color: var(--text); font-size: 12px; font-weight: 800; flex: 1; }
    .panel-btn.primary { background: var(--navy-2); color: #fff; border-color: var(--navy-2); }
    .panel-btn.gold { background: rgba(198, 160, 90, .14); border-color: rgba(198, 160, 90, .42); color: var(--text); }
    .panel-btn.danger { background: rgba(194, 65, 59, .10); border-color: rgba(194, 65, 59, .32); color: var(--danger); }

    .layer-list { display: grid; gap: 8px; }
    .layer-row { display: grid; grid-template-columns: 24px 24px minmax(0, 1fr) 24px 24px; gap: 6px; align-items: center; min-height: 42px; padding: 6px; }
    .layer-row.active { border-color: var(--gold); background: rgba(198, 160, 90, .12); }
    .layer-row input { width: 100%; min-height: 28px; border: 0; background: transparent; color: var(--text); font-weight: 700; outline: 0; padding: 0 4px; }
    .tiny-btn { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; color: var(--muted); border: 1px solid transparent; }
    .tiny-btn:hover { color: var(--text); border-color: var(--line); background: rgba(255, 255, 255, .48); }
    body.dark .tiny-btn:hover { background: rgba(255, 255, 255, .06); }

    .empty-state { padding: 18px; border: 1px dashed var(--line-strong); border-radius: 8px; color: var(--muted); text-align: center; line-height: 1.7; background: rgba(255, 255, 255, .28); }

    .toast { position: fixed; left: 20px; bottom: 20px; z-index: 1000000; display: grid; gap: 8px; pointer-events: none; }
    .toast-item { min-width: 230px; max-width: 360px; padding: 12px 14px; border-radius: 8px; color: #fff; background: rgba(7, 29, 61, .96); box-shadow: var(--soft-shadow); border: 1px solid rgba(255, 255, 255, .12); font-weight: 700; line-height: 1.45; }

    .hidden-input { display: none; }

    .exporting-overlay { position: fixed; inset: 0; z-index: 999999; display: none; place-items: center; background: rgba(7, 18, 33, .68); color: #fff; backdrop-filter: blur(10px); }
    .exporting-overlay.active { display: grid; }
    .export-card { width: min(420px, 92vw); border: 1px solid rgba(255, 255, 255, .18); border-radius: 8px; padding: 20px; background: rgba(11, 27, 51, .92); box-shadow: var(--shadow); text-align: right; }
    .progress { height: 8px; border-radius: 999px; overflow: hidden; background: rgba(255, 255, 255, .16); margin-top: 12px; }
    .progress span { display: block; width: 0%; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-2)); transition: width .2s ease; }

    .kbd { direction: ltr; display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); background: var(--panel-solid); font-size: 11px; font-weight: 800; }

    @media (max-width: 1240px) {
      :root { --left-w: 260px; --right-w: 320px; --thumb-w: 112px; }
      .brand-title span, .stage-meta .dim-text { display: none; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M7 4h10l3 3v13H7a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z" stroke="#e8c978" stroke-width="1.6"/>
            <path d="M9 10h6M9 14h8M9 18h5" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand-title">
          <strong>محرر التقارير الرسمية A4</strong>
          <span>تصميم، طبقات، قوالب، وتصدير PDF مطابق للمعاينة</span>
        </div>
      </div>

      <div class="toolbar-group toolbar-center">
        <button class="icon-btn" id="undoBtn" title="تراجع" aria-label="تراجع" disabled data-action="undo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 14 4 9l5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10a7 7 0 1 1 0 14h-1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="redoBtn" title="إعادة" aria-label="إعادة" disabled data-action="redo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m15 14 5-5-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 9H10a7 7 0 1 0 0 14h1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" title="تكبير" aria-label="تكبير" data-action="zoomIn">

  <div class="toast" id="toast"></div>

  <div class="exporting-overlay" id="exportOverlay">
    <div class="export-card">
      <strong>جاري تصدير التقرير إلى PDF</strong>
      <p id="exportText">تهيئة محرك التصدير...</p>
      <div class="progress"><span id="exportProgress"></span></div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      const A4 = Object.freeze({ w: 210, h: 297 });
      const STORE_KEY = "premium-a4-report-editor-autosave-v1";
      const HISTORY_LIMIT = 60;
      const SNAP_THRESHOLD = 1.6;
      const MIN_SIZE = 4;

      const dom = {};
      const history = { past: [], future: [], muted: false };
      const fileIntent = { type: null };
      let operation = null;
      let autosaveTimer = null;
      let editingElementId = null;

      const state = {
        version: 1,
        activePageId: null,
        selectedId: null,
        zoom: .85,
        previewAll: false,
        showGrid: false,
        snapGrid: true,
        snapElements: true,
        smartGuides: true,
        dark: false,
        inspectorTab: "properties",
        pages: []
      };

      const icons = {
        star: '<svg viewBox="0 0 24 24"><path d="M12 3 14.8 9l6.2.7-4.6 4.2 1.2 6.1L12 16.8 6.4 20l1.2-6.1L3 9.7 9.2 9 12 3Z"/></svg>',
        shield: '<svg viewBox="0 0 24 24"><path d="M12 3 19 6v5c0 5-3 8.5-7 10-4-1.5-7-5-7-10V6l7-3Z"/><path d="m9 12 2 2 4-5"/></svg>',
        check: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 6-7"/></svg>',
        chart: '<svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M7 16V9M12 16V5M17 16v-4"/></svg>',
        building: '<svg viewBox="0 0 24 24"><path d="M4 21h16M6 21V8l6-4 6 4v13"/><path d="M9 21v-4h6v4M9 10h.01M12 10h.01M15 10h.01M9 14h.01M12 14h.01M15 14h.01"/></svg>',
        award: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><path d="m9 13-2 8 5-3 5 3-2-8"/></svg>'
      };

      const templates = [
        { id: "cover", title: "غلاف تقرير رسمي", desc: "عنوان كبير، جهة، تاريخ، شريط ذهبي" },
        { id: "contents", title: "صفحة محتويات", desc: "فهرس أنيق مع أرقام صفحات" },
        { id: "text", title: "صفحة نصوص", desc: "عنوان وفقرة ومربع ملخص" },
        { id: "images", title: "صفحة صور", desc: "شبكة صور وتعليقات" },
        { id: "achievements", title: "صفحة إنجازات", desc: "بطاقات إنجاز وأيقونات" },
        { id: "stats", title: "صفحة إحصائيات", desc: "مؤشرات ورسوم بسيطة" },
        { id: "thanks", title: "صفحة شكر", desc: "رسالة ختامية راقية" },
        { id: "closing", title: "صفحة ختامية", desc: "ختم وتوقيع ومعلومات تواصل" }
      ];

      document.addEventListener("DOMContentLoaded", init);

      function init() {
        cacheDom();
        bindGlobalEvents();
        state.pages = [createTemplatePage("cover")];
        state.activePageId = state.pages[0].id;
        pushHistory("init");
        render();
        toast("تم تجهيز محرر التقارير. ابدأ بإضافة عناصر أو قوالب.");
      }

      function cacheDom() {
        dom.body = document.body;
        dom.pageStack = document.getElementById("pageStack");
        dom.pageThumbs = document.getElementById("pageThumbs");
        dom.propertiesPanel = document.getElementById("propertiesPanel");
        dom.layersPanel = document.getElementById("layersPanel");
        dom.templateList = document.getElementById("templateList");
        dom.zoomLabel = document.getElementById("zoomLabel");
        dom.activePageName = document.getElementById("activePageName");
        dom.autosaveStatus = document.getElementById("autosaveStatus");
        dom.imageInput = document.getElementById("imageInput");
        dom.projectInput = document.getElementById("projectInput");
        dom.exportOverlay = document.getElementById("exportOverlay");
        dom.exportText = document.getElementById("exportText");
        dom.exportProgress = document.getElementById("exportProgress");
        dom.toast = document.getElementById("toast");
        dom.undoBtn = document.getElementById("undoBtn");
        dom.redoBtn = document.getElementById("redoBtn");
      }

      function bindGlobalEvents() {
        document.addEventListener("click", handleDocumentClick);
        document.addEventListener("input", handleDocumentInput);
        document.addEventListener("change", handleDocumentChange);
        document.addEventListener("keydown", handleKeydown);
        document.addEventListener("pointermove", handlePointerMove);
        document.addEventListener("pointerup", endOperation);
        dom.imageInput.addEventListener("change", handleImageFile);
        dom.projectInput.addEventListener("change", handleProjectFile);
      }

      function handleDocumentClick(event) {
        const actionTarget = event.target.closest("[data-action]");
        if (actionTarget) {
          runAction(actionTarget.dataset.action, actionTarget);
          return;
        }

        const addTarget = event.target.closest("[data-add]");
        if (addTarget) {
          addElement(addTarget.dataset.add);
          return;
        }

        const templateTarget = event.target.closest("[data-template]");
        if (templateTarget) {
          addTemplatePage(templateTarget.dataset.template);
          return;
        }

        const tabTarget = event.target.closest("[data-tab]");
        if (tabTarget) {
          state.inspectorTab = tabTarget.dataset.tab;
          renderInspector();
          return;
        }

        const pageTarget = event.target.closest("[data-page-id]");
        if (pageTarget && !event.target.closest(".canvas-element")) {
          setActivePage(pageTarget.dataset.pageId);
          return;
        }

        const elementTarget = event.target.closest(".canvas-element");
        if (elementTarget) {
          selectElement(elementTarget.dataset.id);
          return;
        }

        if (event.target.closest(".stage")) {
          state.selectedId = null;
          editingElementId = null;
          render();
        }
      }

      function handleDocumentInput(event) {
        const target = event.target;
        if (target.matches("[data-prop]")) {
          updateSelectedProperty(target.dataset.prop, target.value, target, { live: true });
        }
        if (target.matches("[data-page-prop]")) {
          updatePageProperty(target.dataset.pageProp, target.value, { live: true });
        }
        if (target.matches("[data-layer-name]")) {
          renameLayer(target.dataset.layerName, target.value);
        }
        if (target.matches("[data-table-cell]")) {
          updateTableCell(target);
        }
      }

      function handleDocumentChange(event) {
        const target = event.target;
        if (target.matches("[data-prop]")) {
          updateSelectedProperty(target.dataset.prop, target.value, target);
        }
        if (target.matches("[data-page-prop]")) {
          updatePageProperty(target.dataset.pageProp, target.value);
        }
      }

      function handleKeydown(event) {
        const activeTag = (document.activeElement && document.activeElement.tagName || "").toLowerCase();
        const isTyping = ["input", "textarea", "select"].includes(activeTag) || document.activeElement?.isContentEditable;
        const selected = getSelected();

        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "s") {
          event.preventDefault();
          downloadProject();
          return;
        }
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "d") {
          event.preventDefault();
          duplicateSelected();
          return;
        }
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "z") {
          event.preventDefault();
          event.shiftKey ? redo() : undo();
          return;
        }

        if (!selected || selected.locked || isTyping) return;

        if (event.key === "Delete" || event.key === "Backspace") {
          event.preventDefault();
          deleteSelected();
          return;
        }

        const step = event.shiftKey ? 5 : 1;
        const map = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
        if (map[event.key]) {
          event.preventDefault();
          const [dx, dy] = map[event.key];
          selected.x = clamp(round(selected.x + dx), 0, A4.w - selected.w);
          selected.y = clamp(round(selected.y + dy), 0, A4.h - selected.h);
          commit("move-key");
        }
      }

      function runAction(action, target) {
        const actions = {
          addPage, duplicatePage, deletePage, movePageUp, movePageDown,
          duplicateSelected, deleteSelected, bringToFront, sendToBack, bringForward, sendBackward,
          toggleLockSelected, toggleSelectedVisibility,
          saveProject: downloadProject, openProject: () => dom.projectInput.click(),
          restoreAutosave, exportPdf,
          uploadLogo: () => openImagePicker("logo"),
          uploadImage: () => openImagePicker("image"),
          uploadExternalElement: () => openImagePicker("external"),
          zoomIn: () => setZoom(state.zoom + .05), zoomOut: () => setZoom(state.zoom - .05),
          toggleTheme, togglePreviewAll, toggleGrid, toggleSnap, toggleGuides, toggleSnapElements, undo, redo
        };
        if (actions[action]) actions[action](target);
      }

      function render() {
        document.body.classList.toggle("dark", state.dark);
        renderTemplates();
        renderPages();
        renderPageThumbs();
        renderInspector();
        updateToolbar();
      }

      function renderTemplates() {
        dom.templateList.innerHTML = templates.map(template => `
          <button class="template-card" data-template="${template.id}">
            <span class="template-mini" aria-hidden="true"></span>
            <span><strong>${escapeHtml(template.title)}</strong><span>${escapeHtml(template.desc)}</span></span>
          </button>
        `).join("");
      }

      function renderPages() {
        const pages = state.previewAll ? state.pages : [getActivePage()].filter(Boolean);
        dom.pageStack.innerHTML = pages.map((page, index) => `
          <div class="page-frame" style="transform:scale(${state.zoom}); margin-bottom:${(state.zoom - 1) * 297}mm">
            <div class="page-caption">
              <strong>${escapeHtml(page.name || ("صفحة " + (index + 1)))}</strong>
              <span>${state.pages.indexOf(page) + 1} / ${state.pages.length}</span>
            </div>
            ${buildPageHtml(page, { interactive: true })}
          </div>
        `).join("");

        bindPageInteractions();
        dom.activePageName.textContent = getActivePage()?.name || "صفحة";
      }

      function buildPageHtml(page, options = {}) {
        const interactive = options.interactive !== false;
        const selectedPage = page.id === state.activePageId ? "selected-page" : "";
        const showGrid = state.showGrid && interactive ? "show-grid" : "";
        const elements = getSortedElements(page).map(element => buildElementHtml(element, page, interactive)).join("");
        const guides = interactive && page.id === state.activePageId && operation?.guides
          ? operation.guides.map(guide => `<span class="smart-guide ${guide.axis}" style="${guide.axis === "v" ? `left:${guide.value}mm` : `top:${guide.value}mm`}"></span>`).join("")
          : "";
        return `
          <div class="report-page ${selectedPage} ${showGrid}" data-page-id="${page.id}">
            <div class="page-grid"></div>
            ${elements}
            ${guides}
          </div>
        `;
      }

      function buildElementHtml(element, page, interactive) {
        const selected = interactive && element.id === state.selectedId && page.id === state.activePageId ? "selected" : "";
        const hidden = element.hidden ? "hidden-layer" : "";
        const locked = element.locked ? "locked" : "";
        const content = buildElementContent(element);
        const handles = interactive && !element.locked ? buildHandles() : "";
        const style = [
          `left:${element.x}mm`, `top:${element.y}mm`, `width:${element.w}mm`, `height:${element.h}mm`,
          `z-index:${element.z}`, `opacity:${element.opacity}`, `transform:rotate(${element.rotation}deg)`
        ].join(";");
        return `
          <div class="canvas-element ${selected} ${hidden} ${locked}" data-id="${element.id}" data-type="${element.type}" style="${style}">
            <div class="element-content" data-content="${element.id}">${content}</div>
            ${handles}
          </div>
        `;
      }

      function buildElementContent(element) {
        const s = element.style || {};
        if (element.type === "text") {
          return `<div class="text-element" style="${textStyle(s)}">${formatMultiline(element.content || "")}</div>`;
        }
        if (element.type === "logo" || element.type === "image") {
          const imgStyle = [
            `object-fit:${s.objectFit || "cover"}`, `object-position:${s.objectX ?? 50}% ${s.objectY ?? 50}%`,
            `border-radius:${s.radius || 0}mm`, `border:${s.borderWidth || 0}mm solid ${s.borderColor || "transparent"}`,
            `box-shadow:${s.shadow || "none"}`
          ].join(";");
          return `<img src="${element.src || placeholderImage(element.type)}" alt="${escapeAttr(element.name)}" style="${imgStyle}">`;
        }
        if (element.type === "shape") {
          const clip = s.shape === "circle" ? "999mm" : `${s.radius || 0}mm`;
          return `<div class="shape-element" style="background:${s.fill || "#f4f6fa"}; border:${s.borderWidth || .4}mm solid ${s.borderColor || "#c6a05a"}; border-radius:${clip}; box-shadow:${s.shadow || "none"}"></div>`;
        }
        if (element.type === "line") {
          return `<div class="line-element" style="background:linear-gradient(90deg, transparent, ${s.color || "#c6a05a"}, transparent); height:${s.stroke || 1}mm; margin-top:${Math.max(0, (element.h - (s.stroke || 1)) / 2)}mm"></div>`;
        }
        if (element.type === "icon") {
          return `<div class="icon-element" style="color:${s.color || "#071d3d"}; filter:${s.shadow ? "drop-shadow(0 2mm 3mm rgba(15,23,42,.22))" : "none"}">${icons[element.icon || "star"]}</div>`;
        }
        if (element.type === "table") {
          return buildTable(element);
        }
        if (element.type === "box") {
          return `<div class="box-element" style="${boxStyle(s)}"><div style="${textStyle(s)}">${formatMultiline(element.content || "")}</div></div>`;
        }
        if (element.type === "divider") {
          return `<div class="divider-element" style="display:flex;align-items:center;gap:2mm;color:${s.color || "#c6a05a"}"><span style="height:${s.stroke || .55}mm;background:currentColor;flex:1"></span><span style="width:3mm;height:3mm;border:${s.stroke || .55}mm solid currentColor;border-radius:999px"></span><span style="height:${s.stroke || .55}mm;background:currentColor;flex:1"></span></div>`;
        }
        if (element.type === "stamp") {
          return `<div class="stamp-element" style="color:${s.color || "#c2413b"};border:${s.stroke || .9}mm double currentColor;background:${s.fill || "rgba(255,255,255,.0)"};font-size:${s.fontSize || 14}pt;transform:rotate(${s.innerRotation || -8}deg)">${formatMultiline(element.content || "معتمد")}</div>`;
        }
        return "";
      }

      function buildTable(element) {
        const cells = element.cells || [];
        const rows = element.rows || 4;
        const cols = element.cols || 3;
        let html = `<table class="table-element" style="font-size:${element.style?.fontSize || 10}pt">`;
        for (let r = 0; r < rows; r++) {
          html += "<tr>";
          for (let c = 0; c < cols; c++) {
            const tag = r === 0 ? "th" : "td";
            const value = cells[r]?.[c] || (r === 0 ? `عنوان ${c + 1}` : "");
            html += `<${tag} contenteditable="${element.locked ? "false" : "true"}" data-table-cell="${element.id}:${r}:${c}">${escapeHtml(value)}</${tag}>`;
          }
          html += "</tr>";
        }
        return html + "</table>";
      }

      function buildHandles() {
        return `
          <span class="rotate-handle" data-handle="rotate"></span>

      function startElementOperation(event) {
        const node = event.currentTarget;
        const element = getElementById(node.dataset.id);
        const page = getActivePage();
        if (!element || !page || element.locked) return;
        if (event.target.matches("[contenteditable='true']")) {
          selectElement(element.id);
          return;
        }
        event.preventDefault();
        event.stopPropagation();
        selectElement(element.id, { render: false });

        const pageNode = node.closest(".report-page");
        const pageRect = pageNode.getBoundingClientRect();
        const mmPerPxX = A4.w / pageRect.width;
        const mmPerPxY = A4.h / pageRect.height;
        const handle = event.target.dataset.handle || "move";

        operation = {
          type: handle === "rotate" ? "rotate" : handle === "move" ? "move" : "resize",
          handle,
          pageId: page.id,
          elementId: element.id,
          startPointer: { x: event.clientX, y: event.clientY },
          mmPerPxX,
          mmPerPxY,
          initial: clone(element),
          pageRect,
          guides: []
        };
        node.setPointerCapture?.(event.pointerId);
        render();
      }

      function handlePointerMove(event) {
        if (!operation) return;
        const element = getElementById(operation.elementId);
        if (!element || element.locked) return;

        const dx = (event.clientX - operation.startPointer.x) * operation.mmPerPxX;
        const dy = (event.clientY - operation.startPointer.y) * operation.mmPerPxY;
        const initial = operation.initial;

        if (operation.type === "move") {
          let x = initial.x + dx;
          let y = initial.y + dy;
          const snapped = snapPosition(element, x, y, initial.w, initial.h);
          element.x = clamp(round(snapped.x), 0, A4.w - element.w);
          element.y = clamp(round(snapped.y), 0, A4.h - element.h);
          operation.guides = snapped.guides;
        }

        if (operation.type === "resize") {
          const next = resizeFromHandle(operation.handle, initial, dx, dy);
          const snapped = snapSizeAndPosition(element, next);
          element.x = snapped.x;
          element.y = snapped.y;
          element.w = snapped.w;
          element.h = snapped.h;
          operation.guides = snapped.guides;
        }

        if (operation.type === "rotate") {
          const cx = operation.pageRect.left + ((initial.x + initial.w / 2) / A4.w) * operation.pageRect.width;
          const cy = operation.pageRect.top + ((initial.y + initial.h / 2) / A4.h) * operation.pageRect.height;
          const angle = Math.atan2(event.clientY - cy, event.clientX - cx) * 180 / Math.PI + 90;
          element.rotation = Math.round(angle);
          operation.guides = [];
        }
        renderPages();
        renderProperties();
        renderLayers();
      }

      function endOperation() {
        if (!operation) return;
        operation = null;
        commit("pointer-operation");
      }

      function resizeFromHandle(handle, initial, dx, dy) {
        const next = { x: initial.x, y: initial.y, w: initial.w, h: initial.h };
        if (handle.includes("e")) next.w = initial.w + dx;
        if (handle.includes("w")) { next.x = initial.x + dx; next.w = initial.w - dx; }
        if (handle.includes("s")) next.h = initial.h + dy;
        if (handle.includes("n")) { next.y = initial.y + dy; next.h = initial.h - dy; }
        if (next.w < MIN_SIZE) { if (handle.includes("w")) next.x -= MIN_SIZE - next.w; next.w = MIN_SIZE; }
        if (next.h < MIN_SIZE) { if (handle.includes("n")) next.y -= MIN_SIZE - next.h; next.h = MIN_SIZE; }
        next.x = clamp(next.x, 0, A4.w - MIN_SIZE);
        next.y = clamp(next.y, 0, A4.h - MIN_SIZE);
        next.w = clamp(next.w, MIN_SIZE, A4.w - next.x);
        next.h = clamp(next.h, MIN_SIZE, A4.h - next.y);
        return next;
      }

      function snapPosition(element, x, y, w, h) {
        let nextX = x; let nextY = y; const guides = [];
        if (state.snapGrid) { nextX = snapToGrid(nextX); nextY = snapToGrid(nextY); }
        if (state.snapElements) {
          const snapX = findSnap("x", element, nextX, w);
          const snapY = findSnap("y", element, nextY, h);
          if (snapX) { nextX += snapX.delta; guides.push({ axis: "v", value: snapX.value }); }
          if (snapY) { nextY += snapY.delta; guides.push({ axis: "h", value: snapY.value }); }
        }
        return { x: nextX, y: nextY, guides: state.smartGuides ? guides : [] };
      }

      function snapSizeAndPosition(element, next) {
        let out = { ...next, guides: [] };
        if (state.snapGrid) {
          out.x = snapToGrid(out.x); out.y = snapToGrid(out.y);
          out.w = Math.max(MIN_SIZE, snapToGrid(out.w)); out.h = Math.max(MIN_SIZE, snapToGrid(out.h));
        }
        out.x = clamp(round(out.x), 0, A4.w - MIN_SIZE); out.y = clamp(round(out.y), 0, A4.h - MIN_SIZE);
        out.w = clamp(round(out.w), MIN_SIZE, A4.w - out.x); out.h = clamp(round(out.h), MIN_SIZE, A4.h - out.y);
        return out;
      }

      function findSnap(axis, element, pos, size) {
        const page = getActivePage(); if (!page) return null;
        const own = [pos, pos + size / 2, pos + size];
        const candidates = axis === "x" ? [0, A4.w / 2, A4.w] : [0, A4.h / 2, A4.h];
        page.elements.forEach(other => {
          if (other.id === element.id || other.hidden) return;
          const p = axis === "x" ? other.x : other.y;
          const s = axis === "x" ? other.w : other.h;
          candidates.push(p, p + s / 2, p + s);
        });
        let best = null;
        own.forEach((value, ownIndex) => {
          candidates.forEach(candidate => {
            const delta = candidate - value;
            if (Math.abs(delta) <= SNAP_THRESHOLD && (!best || Math.abs(delta) < Math.abs(best.delta))) {
              best = { delta, value: candidate, ownIndex };
            }
          });
        });
        return best;
      }

      function snapToGrid(value) { return Math.round(value / 5) * 5; }

      function enableTextEdit(event) {
        const element = getElementById(event.currentTarget.dataset.id);
        if (!element || !["text", "box"].includes(element.type) || element.locked) return;
        editingElementId = element.id; render();
        setTimeout(() => {
          const node = document.querySelector(`[data-content="${element.id}"] .text-element, [data-content="${element.id}"] .box-element > div`);
          if (!node) return;
          node.contentEditable = "true"; node.classList.add("editing"); node.focus(); placeCaretAtEnd(node);
          node.addEventListener("input", () => { element.content = node.textContent; scheduleAutosave(); });
          node.addEventListener("blur", () => { editingElementId = null; commit("text-edit"); }, { once: true });
        }, 0);
      }

      function addElement(type, overrides = {}) {
        const page = getActivePage();
        if (!page) return;

      }

          table: {
            name: "جدول", x: 24, y: 72, w: 160, h: 62, rows: 4, cols: 3,
            cells: [["البند", "الوصف", "الحالة"], ["1", "معلومة أساسية", "مكتمل"], ["2", "معلومة داعمة", "قيد التنفيذ"], ["3", "ملاحظة", "مراجعة"]],

          },

            style: { fontFamily: "Cairo", fontSize: 12, color: "#172033", background: "#f7f8fb", fill: "#f7f8fb", borderColor: "#d9dee8", borderWidth: .35, radius: 4, fontWeight: 500, textAlign: "right", lineHeight: 1.7, textShadow: "none" }
          },
          divider: { name: "فاصل", x: 30, y: 134, w: 150, h: 6, style: { color: "#c6a05a", stroke: .5 } },
          stamp: { name: "ختم", x: 138, y: 224, w: 38, h: 38, content: "معتمد\nرسمياً", style: { color: "#c2413b", fill: "rgba(255,255,255,0)", stroke: .9, fontSize: 12, innerRotation: -8 } }
        };
        return mergeDeep(base, presets[type] || {}, overrides);
      }

      function addPage() {
        const page = createBlankPage(); state.pages.push(page);
        state.activePageId = page.id; state.selectedId = null; commit("add-page");
      }

      function addTemplatePage(templateId) {
        const page = createTemplatePage(templateId); state.pages.push(page);

      function duplicatePage() {
        const page = getActivePage(); if (!page) return;
        const copy = clone(page); copy.id = uid("page"); copy.name = page.name + " - نسخة";
        copy.elements = copy.elements.map(el => ({ ...el, id: uid("el"), name: el.name }));
        const index = state.pages.findIndex(p => p.id === page.id);
        state.pages.splice(index + 1, 0, copy);
        state.activePageId = copy.id; state.selectedId = null; commit("duplicate-page");
      }

      function deletePage() {
        if (state.pages.length <= 1) { toast("يجب أن يحتوي المشروع على صفحة واحدة على الأقل."); return; }
        const index = state.pages.findIndex(p => p.id === state.activePageId);
        state.pages.splice(index, 1);
        state.activePageId = state.pages[Math.max(0, index - 1)].id;
        state.selectedId = null; commit("delete-page");
      }

      function movePageUp() {
        const index = state.pages.findIndex(p => p.id === state.activePageId); if (index <= 0) return;
        [state.pages[index - 1], state.pages[index]] = [state.pages[index], state.pages[index - 1]]; commit("move-page-up");
      }

      function movePageDown() {
        const index = state.pages.findIndex(p => p.id === state.activePageId); if (index < 0 || index >= state.pages.length - 1) return;
        [state.pages[index + 1], state.pages[index]] = [state.pages[index], state.pages[index + 1]]; commit("move-page-down");
      }

      function setActivePage(pageId) {
        if (state.activePageId === pageId) return;
        state.activePageId = pageId; state.selectedId = null; editingElementId = null; render();
      }

      function selectElement(id, opts = {}) {
        const element = getElementById(id); if (!element) return;
        state.selectedId = id; if (opts.render !== false) render();
      }

      function updateSelectedProperty(path, value, input, opts = {}) {
        const element = getSelected(); if (!element || element.locked) return;
        const parsed = parseValue(path, value, input);
        setByPath(element, path, parsed);
        if (path === "style.fill" && ["box"].includes(element.type)) setByPath(element, "style.background", parsed);
        if (path === "style.borderColor" && ["line", "divider", "stamp", "icon"].includes(element.type)) setByPath(element, "style.color", parsed);
        if (["x", "y", "w", "h"].includes(path)) constrainElement(element);
        if (opts.live) { scheduleAutosave(); renderPages(); renderPageThumbs(); renderLayers(); updateToolbar(); return; }
        commit("update-property");
      }

      function updatePageProperty(path, value, opts = {}) {
        const page = getActivePage(); if (!page) return; page[path] = value;
        if (opts.live) { scheduleAutosave(); renderPages(); renderPageThumbs(); updateToolbar(); return; }
        commit("update-page");
      }

      function updateTableCell(input) {
        const [id, r, c] = input.dataset.tableCell.split(":"); const element = getElementById(id);
        if (!element || element.locked) return;
        element.cells ||= []; element.cells[Number(r)] ||= []; element.cells[Number(r)][Number(c)] = input.textContent; scheduleAutosave();
      }

      function renameLayer(id, value) {
        const element = getElementById(id); if (!element) return;
        element.name = value || typeName(element.type); scheduleAutosave(); renderPageThumbs();
      }

      function toggleLayer(id, kind) {
        const element = getElementById(id); if (!element) return;
        if (kind === "visible") element.hidden = !element.hidden;
        if (kind === "lock") element.locked = !element.locked; commit("toggle-layer");
      }

      function moveLayer(id, direction) {
        const element = getElementById(id); if (!element) return;
        element.z += direction === "up" ? 1 : -1; normalizeZ(getActivePage()); commit("move-layer");
      }

      function duplicateSelected() {
        const page = getActivePage(); const element = getSelected(); if (!page || !element) return;
        const copy = clone(element); copy.id = uid("el"); copy.name = element.name + " - نسخة";
        copy.x = clamp(copy.x + 6, 0, A4.w - copy.w); copy.y = clamp(copy.y + 6, 0, A4.h - copy.h);
        copy.z = nextZ(page); page.elements.push(copy); state.selectedId = copy.id; commit("duplicate-element");
      }

      function deleteSelected() {
        const page = getActivePage(); const element = getSelected(); if (!page || !element) return;
        page.elements = page.elements.filter(el => el.id !== element.id); state.selectedId = null; commit("delete-element");
      }

      function bringToFront() {
        const page = getActivePage(); const element = getSelected(); if (!page || !element) return;
        element.z = nextZ(page) + 1; normalizeZ(page); commit("front");
      }

      function sendToBack() {
        const page = getActivePage(); const element = getSelected(); if (!page || !element) return;
        element.z = -1; normalizeZ(page); commit("back");
      }

      function bringForward() {
        const page = getActivePage(); const element = getSelected(); if (!page || !element) return;
        element.z += 1.5; normalizeZ(page); commit("forward");
      }

      function sendBackward() {
        const page = getActivePage(); const element = getSelected(); if (!page || !element) return;
        element.z -= 1.5; normalizeZ(page); commit("backward");
      }

      function toggleLockSelected() {
        const element = getSelected(); if (!element) return;
        element.locked = !element.locked; commit("lock");
      }

      function toggleSelectedVisibility() {
        const element = getSelected(); if (!element) return;
        element.hidden = !element.hidden; commit("visibility");
      }

      function openImagePicker(type) {
        fileIntent.type = type;
        dom.imageInput.value = "";
        dom.imageInput.click();
      }

      function handleImageFile(event) {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          let type = fileIntent.type === "logo" ? "logo" : "image";
          let name = fileIntent.type === "logo" ? "شعار مرفوع" : (fileIntent.type === "external" ? "عنصر خارجي" : "صورة مرفوعة");

          let w = fileIntent.type === "logo" ? 34 : (fileIntent.type === "external" ? 50 : 92);
          let h = fileIntent.type === "logo" ? 34 : (fileIntent.type === "external" ? 50 : 64);
          let x = (A4.w - w) / 2;
          let y = (A4.h - h) / 2;

          addElement(type, {
            name: name, src: reader.result, x: x, y: y, w: w, h: h,
            style: { objectFit: "contain", objectX: 50, objectY: 50, radius: 0, borderWidth: 0, borderColor: "#c6a05a", shadow: "none" }
          });
        };
        reader.readAsDataURL(file);
      }

      function downloadProject() {
        const blob = new Blob([JSON.stringify(serializeState())], { type: "application/json;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `a4-report-project-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        toast("تم حفظ ملف المشروع بنجاح، متضمناً كافة الصور والعناصر.");
      }

      function handleProjectFile(event) {
        const file = event.target.files?.[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const incoming = JSON.parse(reader.result);
            loadState(incoming); pushHistory("open-project"); render(); toast("تم فتح المشروع بنجاح.");
          } catch (error) { toast("تعذر فتح الملف. تأكد أنه JSON صادر من هذا المحرر."); }
        };
        reader.readAsText(file);
      }

      function restoreAutosave() {
        const saved = localStorage.getItem(STORE_KEY);
        if (!saved) { toast("لا توجد نسخة محفوظة تلقائياً بعد."); return; }
        try {
          loadState(JSON.parse(saved)); pushHistory("restore-autosave"); render(); toast("تمت استعادة آخر نسخة محفوظة تلقائياً.");
        } catch (error) { toast("تعذر استعادة النسخة التلقائية."); }
      }

      async function waitForImages(element) {
        const imgs = Array.from(element.querySelectorAll("img"));
        return Promise.all(imgs.map(img => {
          if (img.complete) return Promise.resolve();
          return new Promise((resolve) => {
            img.onload = resolve;
            img.onerror = resolve; // Resolve to not halt rendering if one fails
          });
        }));
      }

      async function exportPdf() {
        if (!window.html2canvas || !window.jspdf?.jsPDF) {
          toast("مكتبات التصدير لم تكتمل بعد. تحقق من اتصال الإنترنت ثم حاول مرة أخرى."); return;
        }
        const previousSelection = state.selectedId;
        state.selectedId = null;
        render();
        dom.exportOverlay.classList.add("active");
        setExportProgress(0, "تهيئة محرك التصدير...");

        const exportRoot = document.createElement("div");
        exportRoot.className = "export-root";
        exportRoot.style.cssText = "position:absolute; top:0; left:-9999px; width:210mm; background:#fff; z-index:-1;";
        document.body.appendChild(exportRoot);

        try {
          await document.fonts?.ready;
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4", compress: true });

          for (let i = 0; i < state.pages.length; i++) {
            const page = state.pages[i];
            setExportProgress((i / state.pages.length) * 100, `جاري معالجة الصفحة ${i + 1} من ${state.pages.length}...`);

            exportRoot.innerHTML = buildPageHtml(page, { interactive: false });
            const node = exportRoot.querySelector(".report-page");

            await waitFrame();
            await waitForImages(node);

            const canvas = await window.html2canvas(node, {
              scale: 4,
              useCORS: true,
              allowTaint: true,
              backgroundColor: "#ffffff",
              logging: false,
              width: node.offsetWidth,
              height: node.offsetHeight,
              windowWidth: node.offsetWidth,
              windowHeight: node.offsetHeight
            });

            const imgData = canvas.toDataURL("image/jpeg", 1.0);
            if (i > 0) pdf.addPage("a4", "portrait");
            pdf.addImage(imgData, "JPEG", 0, 0, A4.w, A4.h, undefined, "FAST");
          }

          setExportProgress(100, "حفظ ملف PDF...");
          pdf.save(`تقرير-A4-رسمي-${new Date().toISOString().slice(0, 10)}.pdf`);
          toast("تم تصدير التقرير بنجاح!");
        } catch (error) {
          console.error("PDF Export Error:", error);
          toast("حدث خطأ أثناء إنشاء الـ PDF. تأكد من حجم الصور المرفوعة أو توفر الذاكرة.");
        } finally {
          exportRoot.remove();
          state.selectedId = previousSelection;
          dom.exportOverlay.classList.remove("active");
          render();
        }
      }

      function setExportProgress(value, text) {
        dom.exportProgress.style.width = `${Math.max(0, Math.min(100, value))}%`;
        dom.exportText.textContent = text;

      function toggleTheme() { state.dark = !state.dark; commit("theme", { skipHistory: true }); }
      function togglePreviewAll() { state.previewAll = !state.previewAll; render(); }
      function toggleGrid() { state.showGrid = !state.showGrid; render(); }
      function toggleSnap() { state.snapGrid = !state.snapGrid; render(); }
      function toggleGuides() { state.smartGuides = !state.smartGuides; render(); }
      function toggleSnapElements() { state.snapElements = !state.snapElements; render(); }
      function setZoom(value) { state.zoom = clamp(Number(value), .35, 1.35); render(); }

      function commit(label, opts = {}) {
        scheduleAutosave();
        if (!opts.skipHistory) pushHistory(label);
        render();
      }

      function pushHistory(label) {
        if (history.muted) return;
        history.past.push(JSON.stringify(serializeState()));
        if (history.past.length > HISTORY_LIMIT) history.past.shift();
        history.future = []; updateToolbar();
      }

      function undo() {
        if (history.past.length <= 1) return;
        const current = history.past.pop(); history.future.push(current);
        const previous = history.past[history.past.length - 1];
        history.muted = true; loadState(JSON.parse(previous)); history.muted = false; render();
      }

      function redo() {
        if (!history.future.length) return;
        const next = history.future.pop(); history.past.push(next);
        history.muted = true; loadState(JSON.parse(next)); history.muted = false; render();
      }

      function scheduleAutosave() {
        clearTimeout(autosaveTimer);
        dom.autosaveStatus.textContent = "حفظ تلقائي...";
        autosaveTimer = setTimeout(() => {
          try {
            localStorage.setItem(STORE_KEY, JSON.stringify(serializeState()));
            dom.autosaveStatus.textContent = "تم الحفظ تلقائياً";
          } catch (e) {
            dom.autosaveStatus.textContent = "خطأ بالحفظ (مساحة ممتلئة)";
          }
        }, 800);
      }

      function serializeState() {
        return {
          version: state.version, activePageId: state.activePageId, selectedId: state.selectedId, zoom: state.zoom,
          previewAll: state.previewAll, showGrid: state.showGrid, snapGrid: state.snapGrid, snapElements: state.snapElements,
          smartGuides: state.smartGuides, dark: state.dark, inspectorTab: state.inspectorTab, pages: state.pages
        };
      }

      function loadState(incoming) {
        state.version = incoming.version || 1; state.activePageId = incoming.activePageId || incoming.pages?.[0]?.id;
        state.selectedId = incoming.selectedId || null; state.zoom = incoming.zoom || .85;
        state.previewAll = Boolean(incoming.previewAll); state.showGrid = Boolean(incoming.showGrid);
        state.snapGrid = incoming.snapGrid !== false; state.snapElements = incoming.snapElements !== false;
        state.smartGuides = incoming.smartGuides !== false; state.dark = Boolean(incoming.dark);
        state.inspectorTab = incoming.inspectorTab || "properties";
        state.pages = Array.isArray(incoming.pages) && incoming.pages.length ? incoming.pages : [createTemplatePage("cover")];
        if (!state.pages.some(p => p.id === state.activePageId)) state.activePageId = state.pages[0].id;
        state.pages.forEach(page => {
          page.elements ||= [];
          page.elements.forEach(el => {
            el.style ||= {}; el.opacity ??= 1; el.rotation ??= 0; el.locked ??= false; el.hidden ??= false;
          });
          normalizeZ(page);
        });

      function addHeader(page, add, title) {
        add("shape", { name: "رأس الصفحة", x: 0, y: 0, w: 210, h: 26, style: { fill: "#071d3d", borderColor: "transparent", borderWidth: 0, radius: 0 } });

        add("logo", { name: "شعار مصغر", x: 174, y: 5, w: 17, h: 17 });
      }

      function addFooter(add) {
        add("line", { name: "خط سفلي", x: 28, y: 274, w: 152, h: 4, style: { color: "#d9dee8", stroke: .35 } });
        add("text", { name: "تذييل", x: 28, y: 279, w: 152, h: 8, content: "وثيقة رسمية - للاستخدام الداخلي", style: { fontFamily: "Cairo", fontSize: 8, color: "#8a93a5", background: "transparent", fontWeight: 600, textAlign: "center", lineHeight: 1.2 } });
      }

      function getActivePage() { return state.pages.find(page => page.id === state.activePageId) || state.pages[0]; }
      function getSelected() { return getElementById(state.selectedId); }
      function getElementById(id) {
        if (!id) return null;
        for (const page of state.pages) {
          const element = page.elements.find(el => el.id === id);
          if (element) return element;
        }
        return null;
      }

      function getSortedElements(page) { return [...(page?.elements || [])].sort((a, b) => a.z - b.z); }
      function nextZ(page) { return Math.max(0, ...page.elements.map(el => el.z || 0)) + 1; }

      function normalizeZ(page) {
        if (!page) return;
        page.elements.sort((a, b) => (a.z || 0) - (b.z || 0)).forEach((el, index) => { el.z = index + 1; });
      }

      function constrainElement(element) {
        element.w = clamp(Number(element.w) || MIN_SIZE, MIN_SIZE, A4.w);
        element.h = clamp(Number(element.h) || MIN_SIZE, MIN_SIZE, A4.h);
        element.x = clamp(Number(element.x) || 0, 0, A4.w - element.w);
        element.y = clamp(Number(element.y) || 0, 0, A4.h - element.h);
        element.opacity = clamp(Number(element.opacity) || 0, 0, 1);
        element.rotation = Number(element.rotation) || 0;
      }

      function typeName(type) {
        return { text: "نص", logo: "شعار", image: "صورة", shape: "شكل", line: "خط زخرفي", icon: "أيقونة", table: "جدول", box: "مربع محتوى", divider: "فاصل", stamp: "ختم" }[type] || "عنصر";
      }

      function templateName(id) { return templates.find(t => t.id === id)?.title || "صفحة جديدة"; }

      function textStyle(s) {
        return [
          `font-family:${cssFont(s.fontFamily || "Tajawal")}`, `font-size:${s.fontSize || 14}pt`, `color:${s.color || "#071d3d"}`, `background:${s.background || "transparent"}`,
          `font-weight:${s.fontWeight || 600}`, `text-align:${s.textAlign || "right"}`, `line-height:${s.lineHeight || 1.5}`, `text-shadow:${s.textShadow || "none"}`, `padding:${s.padding ?? 0}mm`
        ].join(";");
      }

      function boxStyle(s) {
        return [
          `background:${s.fill || s.background || "#ffffff"}`, `border:${s.borderWidth || .35}mm solid ${s.borderColor || "#d9dee8"}`,
          `border-radius:${s.radius || 4}mm`, `box-shadow:${s.shadow || "none"}`, `padding:5mm`, `display:block`
        ].join(";");
      }

      function parseValue(path, value, input) {
        if (["x", "y", "w", "h", "rotation", "opacity"].includes(path) || path.startsWith("style.") && isNumericStyle(path)) { return Number(value); }
        if (input?.type === "checkbox") return input.checked;
        return value;
      }

      function isNumericStyle(path) { return ["style.fontSize", "style.lineHeight", "style.radius", "style.borderWidth", "style.objectX", "style.objectY", "style.stroke", "style.innerRotation"].includes(path); }

      function setByPath(object, path, value) {
        const parts = path.split("."); let target = object;
        for (let i = 0; i < parts.length - 1; i++) { target[parts[i]] ||= {}; target = target[parts[i]]; }
        target[parts[parts.length - 1]] = value;
      }

      function optionList(options, selected) {
        return options.map(option => `<option value="${escapeAttr(option)}" ${String(option) === String(selected) ? "selected" : ""}>${escapeHtml(labelOption(option))}</option>`).join("");
      }

      function labelOption(option) {
        return { right: "يمين", center: "وسط", left: "يسار", justify: "ضبط", cover: "Cover", contain: "Contain", fill: "Fill", rect: "مستطيل", circle: "دائرة", star: "نجمة", shield: "درع", check: "اعتماد", chart: "رسم بياني", building: "مبنى", award: "وسام", none: "بدون" }[option] || option || "بدون";
      }

      function placeholderImage(type) {
        const title = type === "logo" ? "LOGO" : "IMAGE";
        const bg = type === "logo" ? "#ffffff" : "#f4f6fa"; const stroke = type === "logo" ? "#c6a05a" : "#d9dee8"; const text = type === "logo" ? "#071d3d" : "#697184";
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520"><rect width="800" height="520" fill="${bg}"/><rect x="30" y="30" width="740" height="460" rx="26" fill="none" stroke="${stroke}" stroke-width="10"/><path d="M180 350 310 220l92 105 72-70 146 155H160Z" fill="${stroke}" opacity=".45"/><circle cx="275" cy="162" r="42" fill="${stroke}" opacity=".55"/><text x="400" y="450" text-anchor="middle" font-family="Arial" font-size="54" font-weight="700" fill="${text}">${title}</text></svg>`;
        return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
      }

      function formatMultiline(text) { return escapeHtml(text).replace(/\n/g, "<br>"); }
      function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char])); }
      function escapeAttr(value) { return escapeHtml(value).replace(/`/g, "&#096;"); }
      function cssFont(font) { return `"${String(font).replace(/"/g, "")}", Arial, sans-serif`; }
      function toColor(value) { if (!value || value === "transparent" || value.startsWith("rgba")) return "#ffffff"; return value; }
      function clone(value) { return JSON.parse(JSON.stringify(value)); }

      function mergeDeep(...objects) {
        const output = {};
        for (const object of objects) {
          for (const [key, value] of Object.entries(object || {})) {
            if (value && typeof value === "object" && !Array.isArray(value)) { output[key] = mergeDeep(output[key] || {}, value); } else { output[key] = value; }
          }
        }
        return output;
      }

      function uid(prefix) { return `${prefix}-${Math.random().toString(36).slice(2, 9)}-${Date.now().toString(36)}`; }
      function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
      function round(value) { return Math.round((Number(value) || 0) * 100) / 100; }
      function waitFrame() { return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve))); }

      function placeCaretAtEnd(node) {
        const range = document.createRange(); const selection = window.getSelection();
        range.selectNodeContents(node); range.collapse(false); selection.removeAllRanges(); selection.addRange(range);
      }

      function toast(message) {
        const item = document.createElement("div"); item.className = "toast-item"; item.textContent = message; dom.toast.appendChild(item);
        setTimeout(() => { item.style.opacity = "0"; item.style.transform = "translateY(6px)"; item.style.transition = "opacity .2s ease, transform .2s ease"; setTimeout(() => item.remove(), 220); }, 2800);
      }
    })();
  </script>
</body>
